
name: Build StroyObem APK from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Unpack sources
        run: |
          test -f StroyObem_MVP_0.1_GitHub_APK_build.zip
          unzip -q StroyObem_MVP_0.1_GitHub_APK_build.zip -d source
          test -f source/stroyobem/scripts/build_android.sh

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Test source and build APK
        working-directory: source/stroyobem
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --check web/app.js
          bash scripts/build_android.sh

      - name: Verify APK
        run: test -s source/stroyobem/dist/StroyObem-MVP-0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StroyObem-Android-APK
          path: source/stroyobem/dist/StroyObem-MVP-0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
