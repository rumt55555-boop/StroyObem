name: Build StroyObem APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'StroyObem_MVP_0.1_GitHub_APK_build.zip'
      - 'scripts/fix_android_runtime.py'
      - 'scripts/offline_pdf.js'
      - 'scripts/apply_offline_pdf.py'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Unpack sources
        run: |
          test -f StroyObem_MVP_0.1_GitHub_APK_build.zip
          unzip -q StroyObem_MVP_0.1_GitHub_APK_build.zip -d source
          test -f source/stroyobem/scripts/build_android.sh

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Patch Flutter dialog lifecycle
        run: python scripts/fix_android_runtime.py

      - name: Add offline PDF rendering
        run: |
          python scripts/apply_offline_pdf.py
          cp scripts/offline_pdf.js source/stroyobem/web/offline.js
          curl --fail --location --retry 3 -o source/stroyobem/web/pdf.mjs https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs
          curl --fail --location --retry 3 -o source/stroyobem/web/pdf.worker.mjs https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs

      - name: Fix Flutter lint setup
        working-directory: source/stroyobem/android_client
        run: flutter pub add --dev flutter_lints

      - name: Test source and build APK
        working-directory: source/stroyobem
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --check web/app.js
          bash scripts/build_android.sh
          cd android_client
          flutter test test/dialog_lifecycle_test.dart

      - name: Verify APK
        run: test -s source/stroyobem/dist/StroyObem-MVP-0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StroyObem-Android-APK
          path: source/stroyobem/dist/StroyObem-MVP-0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
