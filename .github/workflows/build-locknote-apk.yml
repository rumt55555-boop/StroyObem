name: Build LockNote v7 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LockNote/**'
      - '.github/workflows/build-locknote-apk.yml'

concurrency:
  group: locknote-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-locknote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: LockNote
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project sources
        run: base64 -d sources.tar.bz2.base64 | tar -xj

      - name: Verify project resources
        run: python3 scripts/check_project.py

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          packages=()
          if [[ ! -d "$SDK_ROOT/platforms/android-35" ]]; then
            packages+=("platforms;android-35")
          fi
          if [[ ! -d "$SDK_ROOT/build-tools/35.0.0" ]]; then
            packages+=("build-tools;35.0.0")
          fi
          if (( ${#packages[@]} > 0 )); then
            sdkmanager "${packages[@]}"
          else
            echo "Android SDK already available"
          fi

      - name: Tests and APK in one Gradle invocation
        run: gradle --no-daemon --build-cache testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LockNote-v7-APK
          path: LockNote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
